name: Build Android & Car APKs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Test & Build Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd android_app
          flutter pub get

      - name: Code Quality & Linter Check
        run: |
          cd android_app
          flutter analyze

      - name: Run Unit Tests
        run: |
          cd android_app
          flutter test

      - name: Build Split Release APKs (Phone & Car)
        run: |
          cd android_app
          flutter build apk --release --split-per-abi

      - name: Rename Output Artifacts
        run: |
          mkdir -p output_apks
          cp android_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk output_apks/kuchbhi-phone-arm64.apk
          cp android_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk output_apks/kuchbhi-car-armeabi-v7a.apk

      - name: Upload Phone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuchbhi-phone-arm64-apk
          path: output_apks/kuchbhi-phone-arm64.apk

      - name: Upload Car Stereo APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuchbhi-car-display-armv7-apk
          path: output_apks/kuchbhi-car-armeabi-v7a.apk
